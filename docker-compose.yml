services:
  postgres:
    image: postgres:16-alpine
    container_name: conductor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: conductor-api
    environment:
      DatabaseConfig__ConnectionString: Host=postgres;Port=5432;Database=conductor;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
